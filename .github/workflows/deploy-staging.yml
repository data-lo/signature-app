name: Deploy (Staging)

on:
  push:
    branches:
      - development

jobs:
  test:
    name: Test and build application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # - name: Run tests
      #   run: npm test -- --runInBand --no-watchman

      - name: Build application
        run: npm run build

  deploy:
    name: Build, publish, and deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify build configuration
        env:
          BACKEND_URL_BUILD: ${{ secrets.BACKEND_URL_BUILD }}
        run: |
          if [ -z "$BACKEND_URL_BUILD" ]; then
            echo "BACKEND_URL_BUILD is empty or unavailable."
          else
            echo "BACKEND_URL_BUILD is configured."
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: false
          build-args: |
            BACKEND_URL_BUILD=${{ secrets.BACKEND_URL_BUILD }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
          tags: |
            dataloplatforms/signature-app:latest
            dataloplatforms/signature-app:${{ github.sha }}

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_STAGING_WEBHOOK: ${{ secrets.DOKPLOY_STAGING_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOKPLOY_STAGING_WEBHOOK" ]]; then
            echo "DOKPLOY_STAGING_WEBHOOK is missing from the staging environment." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST "$DOKPLOY_STAGING_WEBHOOK"
